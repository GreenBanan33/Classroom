<!DOCTYPE html>
<html lang="es" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Classroom</title>
    <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-secondary: #2563eb;
            --accent-tertiary: #38bdf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-strong: rgba(255, 255, 255, 0.06);
            --surface-border: rgba(255, 255, 255, 0.09);
            --card-shadow: none;
        }

        body.light-mode {
            --bg-primary: #eef2f7;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent-primary: #2563eb;
            --accent-secondary: #1d4ed8;
            --accent-tertiary: #0ea5e9;
            --surface: #ffffff;
            --surface-strong: #f8fafc;
            --surface-border: #e2e8f0;
            --card-shadow: 0 1px 3px rgba(30, 41, 59, 0.06), 0 1px 2px rgba(30, 41, 59, 0.04);
        }

        html, body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            perspective: 1000px;
        }

        /* --- INTRO CINEMÁTICA 3D --- */
        #intro-cinematica {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #0a0e27, #1a1f3a, #0a0e27);
            background-size: 400% 400%;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 30px;
            animation: cinematicaBg 4s ease infinite;
        }

        @keyframes cinematicaBg {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .intro-contenedor {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 30px;
        }

        .intro-logo {
            width: 120px;
            height: 120px;
            position: relative;
            perspective: 1000px;
        }

        .logo-cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 8s linear infinite;
        }

        @keyframes rotateCube {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        .cube-face {
            position: absolute;
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.4);
        }

        .cube-face:nth-child(1) { transform: rotateY(0deg) translateZ(60px); }
        .cube-face:nth-child(2) { transform: rotateY(90deg) translateZ(60px); }
        .cube-face:nth-child(3) { transform: rotateY(180deg) translateZ(60px); }
        .cube-face:nth-child(4) { transform: rotateY(270deg) translateZ(60px); }
        .cube-face:nth-child(5) { transform: rotateX(90deg) translateZ(60px); }
        .cube-face:nth-child(6) { transform: rotateX(-90deg) translateZ(60px); }

        .intro-titulo {
            text-align: center;
            animation: slideInDown 1s ease-out 0.5s forwards;
            opacity: 0;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .intro-titulo h1 {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary), var(--accent-tertiary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .intro-subtitulo {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .loading-bar {
            width: 220px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            animation: slideInUp 1s ease-out 1s forwards;
            opacity: 0;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary), var(--accent-tertiary));
            animation: loadingFill 4s ease-in-out forwards;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }

        @keyframes loadingFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .particulas-intro {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .particula {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.8), transparent);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        }

        /* --- CONTENIDO PRINCIPAL --- */
        #pantalla-menu {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
            gap: 30px;
            align-items: center;
        }

        #pantalla-juego, #pantalla-chat, #pantalla-2048, #pantalla-cookie, #pantalla-flappy, #pantalla-dino, #pantalla-snake, #pantalla-minas, #pantalla-tetris, #pantalla-memory, #pantalla-pong, #pantalla-wordle, #pantalla-ahorcado, #pantalla-sopa, #pantalla-slope, #pantalla-config {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px 30px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            gap: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
            flex-shrink: 1;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .logo-text h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
            letter-spacing: 1px;
        }

        .controls-header {
            display: flex;
            gap: 15px;
            align-items: center;
            flex: 1;
            min-width: 0;
            justify-content: flex-end;
        }

        .search-box {
            background: var(--surface-strong);
            border: 1px solid var(--surface-border);
            border-radius: 50px;
            padding: 10px 18px;
            color: var(--text-primary);
            width: 100%;
            max-width: 250px;
            min-width: 70px;
            flex-shrink: 1;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .search-box::placeholder {
            color: var(--text-secondary);
        }

        .search-box:focus {
            outline: none;
            background: var(--surface-strong);
            border-color: var(--accent-primary);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        /* ESTILOS DEL BOTÓN ELEGANTE SOLICITADO */
        .boton-elegante {
            padding: 10px 20px;
            border: 2px solid #2c2c2c;
            background-color: #1a1a1a;
            color: #ffffff;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.4s ease;
            outline: none;
            position: relative;
            overflow: hidden;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .boton-elegante::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.25) 0%,
                rgba(255, 255, 255, 0) 70%
            );
            transform: scale(0);
            transition: transform 0.5s ease;
        }

        .boton-elegante:hover::after {
            transform: scale(4);
        }

        .boton-elegante:hover {
            border-color: #666666;
            background: #292929;
        }

        .theme-toggle {
            background: var(--surface-strong);
            border: 1px solid var(--surface-border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: var(--surface-strong);
            border-color: var(--accent-primary);
            transform: scale(1.05) rotate(20deg);
        }

        .stats-banner {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px 30px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .stat-item {
            text-align: center;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        .stat-item:nth-child(1) { animation-delay: 0.1s; }
        .stat-item:nth-child(2) { animation-delay: 0.2s; }
        .stat-item:nth-child(3) { animation-delay: 0.3s; }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            border-radius: 2px;
        }

        .games-container {
            width: 100%;
            max-width: 1200px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .game-card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
            backdrop-filter: blur(10px);
            box-shadow: var(--card-shadow);
        }

        .game-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-primary);
            box-shadow: 0 16px 32px rgba(59, 130, 246, 0.22);
        }

        .game-thumb-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .game-thumb-bg .game-thumb-gradient {
            position: absolute;
            inset: 0;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .game-card:hover .game-thumb-gradient {
            transform: scale(1.12);
        }

        .game-thumb-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-thumb-icon img, .game-thumb-icon .thumb-emoji {
            width: 44%;
            height: 44%;
            max-width: 64px;
            max-height: 64px;
            object-fit: contain;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.45));
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .game-thumb-icon .thumb-emoji {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            line-height: 1;
        }

        .game-card:hover .game-thumb-icon img, .game-card:hover .game-thumb-icon .thumb-emoji {
            transform: scale(1.15) translateY(-4px);
        }

        .game-card::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.75) 75%);
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .game-card-content {
            position: relative;
            z-index: 2;
        }

        body.light-mode .game-thumb-gradient {
            filter: saturate(0.45) brightness(1.5) contrast(0.92);
        }

        body.light-mode .game-card::before {
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.35) 55%, rgba(255,255,255,0.92) 100%);
        }

        .game-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .game-meta {
            font-size: 11px;
            color: var(--accent-tertiary);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .like-button {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 3;
        }

        .like-button:hover {
            background: rgba(0, 0, 0, 0.5);
            transform: scale(1.15);
            border-color: var(--accent-secondary);
        }

        .like-button.liked {
            color: var(--accent-secondary);
            animation: heartPulse 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes heartPulse {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .actions-container {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.4);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 70px;
            padding: 0 25px;
            background: var(--surface);
            border-bottom: 1px solid var(--surface-border);
            backdrop-filter: blur(10px);
        }

        .iframe-container {
            position: relative;
        }

        .iframe-loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: var(--bg-primary, #0d0d14);
            color: var(--text-secondary);
            font-size: 14px;
            z-index: 5;
            transition: opacity 0.3s ease;
        }

        .iframe-loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--accent-primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .fallback-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--surface);
            border-top: 1px solid var(--surface-border);
            font-size: 13px;
            color: var(--text-secondary);
            flex-wrap: wrap;
            text-align: center;
        }

        .btn-fallback {
            padding: 8px 16px;
            border: 1px solid var(--accent-primary);
            background: rgba(59, 130, 246, 0.12);
            color: var(--text-primary);
            border-radius: 50px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-fallback:hover {
            background: var(--accent-primary);
        }

        .local-game-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 20px;
            overflow-y: auto;
        }

        .local-game-hint {
            color: var(--text-secondary);
            font-size: 13px;
            text-align: center;
        }

        /* ============================================================
           JUEGOS SIN CONEXIÓN — réplicas visuales de los originales
           ============================================================ */
        .lg-svgthumb { width: 44%; height: 44%; max-width: 64px; max-height: 64px; filter: drop-shadow(0 6px 16px rgba(0,0,0,.45)); transition: transform .4s cubic-bezier(.4,0,.2,1); }
        .game-card:hover .lg-svgthumb { transform: scale(1.15) translateY(-4px); }

        /* ---------------- 2048 (moderno) ---------------- */
        .g48-wrap { background: radial-gradient(ellipse at 50% -10%, #2a2f5c 0%, #15183a 55%, #0d0f24 100%); color: #e8eaf6; font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; justify-content: flex-start; gap: 0; padding: 18px 12px 30px; --w: min(92vw, 470px, calc(100vh - 250px)); }
        .g48-head { width: var(--w); display: flex; justify-content: space-between; align-items: center; }
        .g48-title { font-size: calc(var(--w) * .17); font-weight: 800; margin: 0; line-height: 1; letter-spacing: -1px; background: linear-gradient(135deg, #8ab4ff 0%, #c58bff 55%, #ff8fb1 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .g48-scores { display: flex; gap: calc(var(--w) * .02); }
        .g48-box { position: relative; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; text-align: center; color: #fff; padding: calc(var(--w) * .022) calc(var(--w) * .05); min-width: calc(var(--w) * .19); font-size: calc(var(--w) * .052); font-weight: 800; line-height: 1.2; backdrop-filter: blur(6px); }
        .g48-box span { display: block; font-size: calc(var(--w) * .024); color: #9aa3d6; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; }
        .g48-add { position: absolute; left: 0; right: 0; top: 0; color: #9be7a8; font-weight: 800; pointer-events: none; animation: g48up .7s ease-out forwards; }

        .tt-wrap { background: radial-gradient(ellipse at 50% -10%, #2c3170 0%, #14173a 55%, #0a0c1f 100%); gap: 12px; justify-content: center; font-family: "Inter", "Segoe UI", system-ui, sans-serif; color: #e8eaf6; }

        .tt-msg { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; border-radius: 14px; background: rgba(10,12,31,.68); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding: 12px; }
        .tt-msg.show { display: flex; }
        .tt-msg h3 { margin: 0; font-size: 26px; font-weight: 800; background: linear-gradient(135deg, #8ab4ff, #c58bff, #ff8fb1); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .tt-msg p { margin: 0; font-size: 13px; color: #aab2e0; }
        .tt-msg button { margin-top: 10px; background: linear-gradient(135deg, #7c6cff, #a25dff); color: #fff; border: 0; border-radius: 12px; padding: 11px 26px; font: 700 15px inherit; cursor: pointer; box-shadow: 0 6px 18px rgba(124,108,255,.45); }

        .tt-pad button { width: 56px; height: 46px; border: 0; border-radius: 12px; background: rgba(255,255,255,.1); color: #fff; font-size: 18px; touch-action: manipulation; backdrop-filter: blur(4px); }
        .tt-pad button:active { background: rgba(255,255,255,.25); }
        @media (pointer: coarse) { .tt-pad { display: flex; } }
        .tt-wrap .local-game-hint { color: #8f98d4; text-align: center; }
        @media (max-width: 520px) { .tt-game { gap: 8px; } .tt-val { font-size: 17px; } .tt-card { padding: 7px 7px 9px; } }
        /* ============ Nuevos juegos (Memory, Pong, Wordle, Ahorcado, Sopa) ============ */
        .gm-wrap { font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; color: #e8eaf6; justify-content: flex-start; gap: 14px; padding: 18px 12px 28px; overflow-y: auto; }
        .gm-bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
        .gm-pill { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 8px 14px; color: #fff; font-weight: 800; font-size: 17px; display: flex; gap: 8px; align-items: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); font-variant-numeric: tabular-nums; }
        .gm-pill small { font-size: 10px; letter-spacing: 1.3px; text-transform: uppercase; color: #a9b0e0; font-weight: 800; }
        .gm-select { appearance: none; -webkit-appearance: none; background-color: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.16); border-radius: 14px; padding: 10px 34px 10px 14px; font: 700 15px "Inter", "Segoe UI", sans-serif; cursor: pointer; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='white' stroke-width='2'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; }
        .gm-select option { color: #1e2147; }
        .gm-btn { background: linear-gradient(135deg, #7c6cff, #a25dff); color: #fff; border: 0; border-radius: 14px; padding: 11px 22px; font: 800 15px "Inter", "Segoe UI", sans-serif; cursor: pointer; box-shadow: 0 6px 18px rgba(124,108,255,.4); transition: transform .12s, box-shadow .12s; }
        .gm-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(124,108,255,.55); }
        .gm-btn:active { transform: translateY(1px); }
        .gm-seg { display: inline-flex; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 4px; }
        .gm-seg button { border: 0; background: none; color: #cfd5ff; padding: 8px 16px; border-radius: 10px; font: 800 14px "Inter", "Segoe UI", sans-serif; cursor: pointer; }
        .gm-seg button.on { background: linear-gradient(135deg, #7c6cff, #a25dff); color: #fff; box-shadow: 0 4px 12px rgba(124,108,255,.4); }
        .gm-hint { color: #8f98d4; font-size: 13px; text-align: center; margin: 0; }
        .gm-ov { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; text-align: center; border-radius: inherit; background: rgba(10,12,35,.66); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); padding: 14px; z-index: 20; }
        .gm-ov.show { display: flex; animation: gmfade .25s ease; }
        @keyframes gmfade { from { opacity: 0; } to { opacity: 1; } }
        .gm-ov h3 { margin: 0; font-size: 30px; font-weight: 800; background: linear-gradient(135deg, #8ab4ff, #c58bff, #ff8fb1); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .gm-ov p { margin: 0 0 6px; color: #cfd5ff; font-size: 15px; font-weight: 600; }

        /* ---------------- Memory ---------------- */
        .mm-wrap { background: radial-gradient(ellipse at 50% -10%, #43267f 0%, #1c1445 55%, #0d0b25 100%); }
        .mm-board { --c: 4; --cs: 100px; position: relative; display: grid; grid-template-columns: repeat(var(--c), var(--cs)); gap: 10px; perspective: 900px; }
        .mm-card { width: var(--cs); height: var(--cs); cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .mm-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,1.2,.4,1); }
        .mm-card.vol .mm-in { transform: rotateY(180deg); }
        .mm-f, .mm-b { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; align-items: center; justify-content: center; }
        .mm-f { background: linear-gradient(145deg, #7c6cff, #a25dff); box-shadow: 0 8px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35); }
        .mm-f::after { content: ''; width: 34%; height: 34%; border-radius: 50%; border: 3px solid rgba(255,255,255,.4); }
        .mm-card:hover .mm-f { filter: brightness(1.12); }
        .mm-b { background: linear-gradient(145deg, #ffffff, #e3e8ff); transform: rotateY(180deg); font-size: calc(var(--cs) * .5); box-shadow: 0 8px 18px rgba(0,0,0,.35); }
        .mm-card.ok .mm-b { background: linear-gradient(145deg, #d6ffe9, #8be3b8); animation: mmpulse .5s ease; }
        .mm-card.mal .mm-b { background: linear-gradient(145deg, #ffe3e8, #ffb3c0); }
        @keyframes mmpulse { 0%, 100% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.12); } }

        /* ---------------- Pong ---------------- */
        .pg-wrap { background: radial-gradient(ellipse at 50% -10%, #1f3a7a 0%, #101a3d 55%, #090d22 100%); }
        .pg-stage { position: relative; width: min(96vw, 900px, calc((100vh - 230px) * 1.6)); border-radius: 22px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.1); }
        #pong-canvas { display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; touch-action: none; cursor: none; }

        /* ---------------- Wordle ---------------- */
        .wd-wrap { background: radial-gradient(ellipse at 50% -10%, #1d4a52 0%, #0f2630 55%, #080f17 100%); gap: 10px; }
        .wd-board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; width: min(86vw, 330px, calc((100vh - 400px) * 5 / 6)); }
        .wd-fila { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .wd-fila.shake { animation: wdshake .45s; }
        @keyframes wdshake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
        .wd-t { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,.16); border-radius: 10px; font-weight: 800; font-size: clamp(20px, 6.4vw, 32px); color: #fff; text-transform: uppercase; background: rgba(255,255,255,.04); transition: border-color .1s; }
        .wd-t.lleno { border-color: rgba(255,255,255,.5); animation: wdpop .12s; }
        @keyframes wdpop { 50% { transform: scale(1.1); } }
        .wd-t.flip { animation: wdflip .5s ease forwards; }
        @keyframes wdflip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
        .wd-t.c-ok, .wd-k.c-ok { background: linear-gradient(145deg, #2fc98a, #14956a); border-color: transparent; color: #fff; }
        .wd-t.c-mid, .wd-k.c-mid { background: linear-gradient(145deg, #f5b942, #d68d12); border-color: transparent; color: #fff; }
        .wd-t.c-no, .wd-k.c-no { background: #2b3446; border-color: transparent; color: #aab2c8; }
        .wd-t.rebote { animation: wdwin .6s ease; }
        @keyframes wdwin { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px); } }
        .wd-kb { display: flex; flex-direction: column; gap: 6px; width: min(98vw, 520px); }
        .wd-kr { display: flex; gap: 5px; justify-content: center; }
        .wd-k { flex: 1; max-width: 44px; height: 52px; border: 0; border-radius: 9px; background: rgba(255,255,255,.13); color: #fff; font: 800 15px "Inter", "Segoe UI", sans-serif; cursor: pointer; padding: 0; transition: background .2s, transform .08s; touch-action: manipulation; }
        .wd-k:active { transform: scale(.94); }
        .wd-k.ancha { flex: 1.6; max-width: 70px; font-size: 12px; }
        .wd-msg { min-height: 26px; font-weight: 800; font-size: 15px; color: #fff; background: rgba(255,255,255,.1); border-radius: 10px; padding: 4px 14px; opacity: 0; transition: opacity .2s; }
        .wd-msg.show { opacity: 1; }
        .wd-card { position: relative; }
        .wd-stats { display: flex; gap: 22px; justify-content: center; margin: 4px 0 8px; }
        .wd-stats div { text-align: center; font-size: 26px; font-weight: 800; line-height: 1.1; }
        .wd-stats small { display: block; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: #a9b0e0; font-weight: 800; }

        /* ---------------- Ahorcado ---------------- */
        .ah-wrap { background: radial-gradient(ellipse at 50% -10%, #5a2a52 0%, #2a1535 55%, #120a1c 100%); }
        .ah-main { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(96vw, 560px); background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 18px 16px 20px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 24px 60px rgba(0,0,0,.4); }
        .ah-fig { width: min(52vw, 200px); height: auto; }
        .ah-fig .base { stroke: #9aa3d6; stroke-width: 6; stroke-linecap: round; fill: none; }
        .ah-fig .parte { stroke: #ffd166; stroke-width: 6; stroke-linecap: round; fill: none; stroke-dasharray: 200; stroke-dashoffset: 200; }
        .ah-fig .parte.show { animation: ahdraw .5s ease forwards; }
        @keyframes ahdraw { to { stroke-dashoffset: 0; } }
        .ah-cat { background: rgba(255,255,255,.1); border-radius: 20px; padding: 5px 16px; font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: #ffd1ef; }
        .ah-palabra { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; min-height: 52px; }
        .ah-l { width: clamp(26px, 8vw, 40px); height: clamp(36px, 10vw, 50px); border-bottom: 4px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: clamp(20px, 6vw, 30px); color: #fff; }
        .ah-l.rev { animation: wdpop .25s; }
        .ah-l.perd { color: #ff7a8f; }
        .ah-vidas { display: flex; gap: 6px; font-size: 18px; }
        .ah-kb { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%; }
        .ah-k { width: clamp(30px, 9vw, 44px); height: clamp(38px, 11vw, 46px); border: 0; border-radius: 10px; background: rgba(255,255,255,.13); color: #fff; font: 800 16px "Inter", "Segoe UI", sans-serif; cursor: pointer; touch-action: manipulation; padding: 0; transition: background .2s, transform .08s; }
        .ah-k:active { transform: scale(.92); }
        .ah-k.ok { background: linear-gradient(145deg, #2fc98a, #14956a); }
        .ah-k.no { background: #3a2a46; color: #8a7a96; }
        .ah-k:disabled { cursor: default; }

        /* ---------------- Sopa de letras ---------------- */
        .sp-wrap { background: radial-gradient(ellipse at 50% -10%, #1a4e6b 0%, #0e2740 55%, #08111f 100%); }
        .sp-main { display: flex; gap: 16px; align-items: flex-start; justify-content: center; flex-wrap: wrap; max-width: 100%; }
        .sp-gridwrap { position: relative; border-radius: 20px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); padding: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .sp-grid { --n: 10; --cs: 38px; display: grid; grid-template-columns: repeat(var(--n), var(--cs)); gap: 3px; touch-action: none; user-select: none; -webkit-user-select: none; }
        .sp-c { width: var(--cs); height: var(--cs); display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: 800; font-size: calc(var(--cs) * .46); color: #e8f4ff; background: rgba(255,255,255,.06); cursor: pointer; transition: background .12s, transform .12s; }
        .sp-c.sel { background: linear-gradient(145deg, #ffd166, #ff9f43); color: #3a2300; transform: scale(1.08); }
        .sp-c.f { background: var(--fc, #2fc98a); color: #fff; }
        .sp-words { display: flex; flex-wrap: wrap; gap: 8px; max-width: 280px; }
        .sp-w { padding: 7px 13px; border-radius: 20px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); font-weight: 800; font-size: 13px; letter-spacing: .5px; color: #fff; transition: all .25s; }
        .sp-w.ok { text-decoration: line-through; opacity: .7; border-color: transparent; color: #fff; background: var(--fc, #2fc98a); }
        .sp-tema { font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: #8fd3ff; margin-bottom: 8px; }
        @media (max-width: 700px) { .sp-words { max-width: 100%; justify-content: center; } }
        /* ---------------- Paneles desplegables: Recientes / Puntuaciones ---------------- */
        .panel-desplegable { flex-shrink: 0; width: 100%; max-width: 1200px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 22px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: var(--card-shadow); overflow: hidden; }
        .panel-cab { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: none; border: 0; padding: 18px 26px; color: var(--text-primary); font: inherit; font-size: 20px; font-weight: 800; cursor: pointer; text-align: left; letter-spacing: -.2px; }
        .panel-cab:focus-visible { outline: 2px solid #60a5fa; outline-offset: -4px; border-radius: 22px; }
        .panel-tit { display: flex; align-items: center; gap: 10px; }
        .panel-ico { font-size: 22px; line-height: 1; }
        .panel-flecha { font-size: 13px; color: var(--text-secondary); transition: transform .3s ease; display: inline-block; }
        .panel-desplegable.cerrado .panel-flecha { transform: rotate(180deg); }
        .panel-cuerpo { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .32s ease; }
        .panel-desplegable.cerrado .panel-cuerpo { grid-template-rows: 0fr; }
        .panel-int { overflow: hidden; min-height: 0; }
        .panel-chips { display: flex; flex-wrap: wrap; gap: 12px; padding: 2px 26px 22px; }
        .panel-chip { display: flex; align-items: center; gap: 12px; background: rgba(148,163,184,.13); border: 1px solid rgba(148,163,184,.28); border-radius: 18px; padding: 12px 18px; color: var(--text-primary); font: inherit; cursor: pointer; text-align: left; transition: transform .15s, background .15s, border-color .15s; }
        .panel-chip:hover { transform: translateY(-2px); background: rgba(148,163,184,.22); border-color: rgba(148,163,184,.5); }
        .panel-chip-ico { font-size: 28px; line-height: 1; }
        .panel-chip-txt { display: flex; flex-direction: column; gap: 1px; }
        .panel-chip-nom { font-size: 16px; font-weight: 800; line-height: 1.2; }
        .panel-chip-sub { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
        .panel-vacio { padding: 0 26px 22px; font-size: 14px; color: var(--text-secondary); }
        @media (max-width: 600px) { .panel-cab { padding: 15px 18px; font-size: 18px; } .panel-chips { padding: 2px 18px 18px; gap: 10px; } .panel-chip { padding: 10px 14px; } }

        /* ---------------- Portales personalizables ---------------- */
        .portal-add { border: 2px dashed var(--surface-border); background: transparent !important; box-shadow: none !important; }
        .portal-add .game-thumb-gradient { background: transparent !important; }
        .portal-add:hover { border-color: var(--accent-primary); }
        .portal-plus { font-size: 62px; font-weight: 300; line-height: 1; color: var(--text-secondary); transition: transform .3s, color .3s; }
        .portal-add:hover .portal-plus { transform: scale(1.15) rotate(90deg); color: var(--accent-primary); }
        .portal-letra { display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; color: #fff; }
        .portal-del { position: absolute; top: 10px; left: 10px; z-index: 5; min-width: 30px; height: 30px; padding: 0 8px; border: 0; border-radius: 15px; background: rgba(0,0,0,.38); color: #fff; font: 800 13px inherit; cursor: pointer; opacity: 0; transition: opacity .2s, background .2s; backdrop-filter: blur(4px); }
        .game-card:hover .portal-del, .portal-del.confirm, .portal-del:focus-visible { opacity: 1; }
        @media (hover: none) { .portal-del { opacity: .9; } }
        .portal-del:hover { background: #ef4444; }
        .portal-del.confirm { background: #ef4444; }
        .mp-overlay { position: fixed; inset: 0; z-index: 5000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(8,12,28,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .mp-overlay.show { display: flex; animation: mpfade .2s ease; }
        @keyframes mpfade { from { opacity: 0; } to { opacity: 1; } }
        .mp-box { width: min(94vw, 440px); background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--surface-border); border-radius: 22px; padding: 24px 24px 20px; box-shadow: 0 30px 80px rgba(0,0,0,.45); animation: mppop .25s cubic-bezier(.2,1.3,.4,1); }
        @keyframes mppop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .mp-box h3 { margin: 0 0 4px; font-size: 22px; font-weight: 800; }
        .mp-sub { margin: 0 0 16px; font-size: 14px; color: var(--text-secondary); }
        .mp-box label { display: block; font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 12px; }
        .mp-box input[type="text"] { display: block; width: 100%; margin-top: 6px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--surface-border); background: var(--bg-primary); color: var(--text-primary); font: 600 15px inherit; outline: none; text-transform: none; letter-spacing: 0; }
        .mp-box input[type="text"]:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(59,130,246,.25); }
        .mp-box .mp-check { display: flex; align-items: center; gap: 10px; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 700; color: var(--text-primary); cursor: pointer; margin-bottom: 8px; }
        .mp-check input { width: 18px; height: 18px; accent-color: var(--accent-primary); }
        .mp-nota { font-size: 12.5px; line-height: 1.45; color: var(--text-secondary); margin-bottom: 10px; }
        .mp-error { min-height: 18px; font-size: 13px; font-weight: 700; color: #ef4444; margin-bottom: 8px; }
        .mp-acc { display: flex; gap: 10px; justify-content: flex-end; }
        .mp-btn { border: 0; border-radius: 12px; padding: 11px 22px; font: 800 15px inherit; cursor: pointer; background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary)); color: #fff; }
        .mp-btn.sec { background: var(--bg-tertiary); color: var(--text-primary); }
        /* ---------------- Slope Paisaje ---------------- */
        .sl-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #0b1020; font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; }
        #slope-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
        .slp-ov { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; background: rgba(8,12,30,.55); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); color: #fff; z-index: 5; }
        .slp-ov.show { display: flex; animation: gmfade .3s ease; }

            display: flex;
